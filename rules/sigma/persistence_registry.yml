title: Registry Persistence via Run/RunOnce Keys
id: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
status: experimental
description: Detects modifications to Run and RunOnce registry keys commonly used
    by malware to establish auto-start persistence at user logon.
references:
  - https://attack.mitre.org/techniques/T1547/001/
  - https://redcanary.com/threat-detection-report/techniques/boot-or-logon-autostart-execution/
author: GANDALF (MORDOR)
date: 2026-05-09
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_run_keys:
    TargetObject|contains:
      - '\Software\Microsoft\Windows\CurrentVersion\Run'
      - '\Software\Microsoft\Windows\CurrentVersion\RunOnce'
      - '\Software\Microsoft\Windows\CurrentVersion\RunOnceEx'
      - '\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Run'
      - '\Wow6432Node\Microsoft\Windows\CurrentVersion\RunOnce'
  selection_suspicious_locations:
    Details|contains:
      - '\AppData\Roaming\'
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - '\Temporary Internet Files\'
      - 'C:\Windows\Temp\'
      - 'powershell.exe'
      - 'mshta.exe'
      - 'rundll32.exe'
      - 'regsvr32.exe'
      - 'cscript.exe'
      - 'wscript.exe'
  selection_suspicious_extensions:
    Details|endswith:
      - '.tmp'
      - '.scr'
      - '.pif'
      - '.com'
      - '.bat'
      - '.vbs'
      - '.ps1'
      - '.js'
  condition: selection_run_keys and 1 of selection_suspicious_*
falsepositives:
  - Legitimate software installers that write to RunOnce for post-install cleanup
  - Official enterprise deployment tools (SCCM, Group Policy) that configure Run keys for authorized software
  - User-initiated modifications to Run keys for legitimate auto-start applications
level: high
