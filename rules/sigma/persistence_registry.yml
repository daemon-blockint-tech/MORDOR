title: Registry Persistence via Service Key Modification
id: 3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f
status: experimental
description: Detects modification of service registry keys to hijack existing services
    or create new malicious services for persistence. Monitors ImagePath changes,
    FailureCommand, and Parameters keys for suspicious binary paths.
references:
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1574/011/
  - https://www.elastic.co/guide/en/security/current/service-imagepath-hijack.html
author: GANDALF (MORDOR)
date: 2026-05-09
tags:
  - attack.persistence
  - attack.t1543.003
  - attack.t1574.011
logsource:
  category: registry_event
  product: windows
detection:
  selection_service_path:
    TargetObject|contains:
      - '\Services\'
    TargetObject|endswith:
      - '\ImagePath'
      - '\FailureCommand'
      - '\Parameters'
  selection_suspicious_image_path:
    Details|contains:
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - 'C:\Windows\Temp\'
      - 'cmd.exe /c '
      - 'powershell.exe '
      - 'rundll32.exe '
      - 'regsvr32.exe '
  selection_unusual_extension:
    Details|endswith:
      - '.tmp'
      - '.bat'
      - '.vbs'
      - '.ps1'
      - '.js'
  selection_lsass_protected:
    TargetObject|contains:
      - '\lsass'
      - '\winlogon'
      - '\svchost'
    Details|contains:
      - 'Debugger'
  condition: selection_service_path and (selection_suspicious_image_path or selection_unusual_extension or selection_lsass_protected)
falsepositives:
  - Legitimate administrators deploying or updating services via Group Policy
  - Antivirus software that registers protected process services via Debugger key
  - Enterprise software installers that modify service ImagePath during patch or update
level: high
