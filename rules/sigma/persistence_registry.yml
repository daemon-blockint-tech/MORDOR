title: Registry Persistence — Debugger Takeover and Image Path Hijack
id: 4d5e6f7a-8b9c-0d1e-3a4b-5c6d7e8f9a0b
status: experimental
description: Detects debugger takeover technique where malware sets a Debugger
    value under an executable's SilentProcessExit or image file execution options
    to hijack execution. Also covers BootExecute and AppInit_DLLs persistence.
references:
  - https://attack.mitre.org/techniques/T1546/012/
  - https://attack.mitre.org/techniques/T1546/008/
  - https://attack.mitre.org/techniques/T1547/011/
  - https://www.hexacorn.com/blog/2013/09/19/beyond-good-ol-run-key-part-2/
author: GANDALF (MORDOR)
date: 2026-05-09
tags:
  - attack.persistence
  - attack.t1546.012
  - attack.t1546.008
  - attack.t1547.011
logsource:
  category: registry_set
  product: windows
detection:
  selection_debugger:
    TargetObject|contains:
      - '\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\'
      - '\Microsoft\Windows NT\CurrentVersion\SilentProcessExit\'
    TargetObject|endswith: '\Debugger'
  selection_boot_execute:
    TargetObject|contains:
      - '\Microsoft\Windows NT\CurrentVersion\Winlogon'
    TargetObject|endswith: 'BootExecute'
    Details|contains:
      - 'autocheck'
      - 'chkdsk'
  selection_appinit_dlls:
    TargetObject|contains:
      - '\Microsoft\Windows NT\CurrentVersion\Windows'
    TargetObject|endswith:
      - 'AppInit_DLLs'
      - 'LoadAppInit_DLLs'
    Details: '*'
  selection_suspicious_debugger_value:
    Details|contains:
      - '\AppData\Roaming\'
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
      - 'powershell.exe'
      - 'rundll32.exe'
      - 'mshta.exe'
      - 'regsvr32.exe'
  condition: selection_debugger and selection_suspicious_debugger_value
      or selection_boot_execute
      or (selection_appinit_dlls and Details contains '.dll' and not Details|contains 'system32')
falsepositives:
  - Legitimate developers using IFEO Debugger keys for debugging native applications
  - Windows BootExecute normally runs autocheck on boot (chkdsk); monitor for abnormal values only
  - Legitimate AppInit_DLLs entries from graphics drivers or accessibility software (e.g., nvinit.dll, ctfmon.dll)
level: high
