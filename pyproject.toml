[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mordor"
version = "1.0.0"
description = "Malware Orchestration & Reverse engineering Detection Operations Runtime"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "daemon" },
]

dependencies = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.31",
    "sse-starlette>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "textual>=8.0.0",
    "yara-python>=4.5.0",
    "shodan>=1.31.0",
    "volatility3>=2.7.0",
    "frida>=16.0.0",
    "click>=8.0.0",
]

[project.scripts]
mordor = "cli.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["vendor/", ".venv/", "venv/", "__pycache__/", "*.pyi"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
timeout = 60
timeout_method = "thread"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access (deselect with '-m \"not network\"')",
    "integration: marks integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["agents", "graph", "tools"]
omit = ["tests/*", "*/venv/*", "*/.venv/*"]

[tool.setuptools.packages.find]
include = ["api", "cli", "agents", "agents.*", "graph", "graph.*", "tools", "tools.*"]
